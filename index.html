  <!-- ==========================================================================
       LA PORTE D'ENTRÉE DU JEU
       ==========================================================================
       Ouvrir ce fichier, c'est jouer. Il n'y a rien d'autre à savoir.

       Avant le 9 août 2026, `index.html` lançait la version 2D des débuts, et il
       fallait repérer un petit lien en bas de page pour atteindre la 3D — celle
       qui a les six régions, les arènes, les 137 créatures et les légendaires.
       Autrement dit : le fichier principal n'ouvrait pas le jeu principal.

       Il redirige donc vers `index3d.html`. La version 2D n'a pas disparu pour
       autant : elle est devenue `index2d.html`, et l'écran-titre de la 3D y
       renvoie toujours.
       ====================================================================== -->
  <meta http-equiv="refresh" content="0; url=index3d.html">
  <link rel="canonical" href="index3d.html">

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      color: #ffe066;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }

    h1 { font-size: 1.8rem; margin: 0; }
    p { color: #bfc7de; margin: 0; }
    a { color: #ffe066; }
  </style>
</head>
<body>
  <!-- Ce qui s'affiche pendant la fraction de seconde de la redirection — et
       tout ce qui reste si jamais elle ne se déclenchait pas. -->
